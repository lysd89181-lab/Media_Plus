<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Plus API</title>
</head>
<body>
    <pre id="response"></pre>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyARNJOPAycWU3YJdZSBN1d9uoLrvso3i4Y",
            authDomain: "cd-card-87365.firebaseapp.com",
            projectId: "cd-card-87365",
            storageBucket: "cd-card-87365.firebasestorage.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ✅ WEBHOOK_URL لتلقي البيانات من التطبيقات الخارجية
        const WEBHOOK_URL = "https://eogwntzweojdgz3.m.pipedream.net";

        async function handleAPIRequest() {
            const params = new URLSearchParams(window.location.search);
            const data = {
                user_name: params.get('user_name') || 'External System',
                user_email: params.get('user_email') || 'api@mediaplus.ly',
                user_phone: params.get('user_phone') || '---',
                action_type: params.get('action_type') || 'API Request 📡',
                details: params.get('details') || 'No details provided',
                timestamp: new Date().toLocaleString('ar-LY'),
                source: params.get('source') || 'external_api'
            };

            try {
                // ✅ 1. حفظ في Firebase
                await db.collection("api_logs").add({
                    ...data,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                // ✅ 2. إرسال إشعار تيليجرام
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                document.getElementById('response').innerText = JSON.stringify({ success: true, message: 'Data received and notification sent', data: data }, null, 2);
            } catch (e) {
                document.getElementById('response').innerText = JSON.stringify({ success: false, error: e.message }, null, 2);
            }
        }

        handleAPIRequest();
    </script>
</body>
</html>
