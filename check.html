<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فحص كاردو</title>
<style>
body{font-family:system-ui,sans-serif;background:#0F172A;color:#fff;
  padding:20px;margin:0;line-height:1.7;font-size:15px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:#94A3B8;font-size:13px;margin-bottom:20px}
.row{background:#1B2438;border-radius:12px;padding:14px;margin-bottom:10px}
.row .t{font-weight:600;margin-bottom:3px;display:flex;gap:8px;align-items:center}
.row .d{color:#94A3B8;font-size:12.5px;word-break:break-all}
.ok{color:#10B981}.bad{color:#EF4444}.wait{color:#F59E0B}
button{background:#10B981;color:#fff;border:none;padding:14px 20px;
  border-radius:11px;font:inherit;font-weight:600;width:100%;margin-top:14px}
button.g{background:#334155}
</style>
</head>
<body>
<h1>فحص كاردو</h1>
<p class="sub">يكتشف سبب الصفحة البيضاء</p>
<div id="out"></div>
<button onclick="killSW()">مسح Service Worker والكاش</button>
<button class="g" onclick="location.reload()">إعادة الفحص</button>

<script>
const out = document.getElementById('out');
function add(title, state, detail){
  const icons = {ok:'✅', bad:'❌', wait:'⏳'};
  out.insertAdjacentHTML('beforeend',
    `<div class="row"><div class="t"><span class="${state}">${icons[state]}</span>
     ${title}</div><div class="d">${detail}</div></div>`);
}

// 1. JavaScript
add('JavaScript يعمل','ok','المتصفح ينفّذ الأكواد');

// 2. ES Modules
const m = document.createElement('script');
m.type = 'module';
m.textContent = "window.__mod = true;";
document.head.appendChild(m);
setTimeout(()=> add('ES Modules', window.__mod?'ok':'bad',
  window.__mod ? 'مدعومة' : 'غير مدعومة — المتصفح قديم جدًا'), 300);

// 3. Service Worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(rs=>{
    if(rs.length) add('Service Worker','bad',
      `${rs.length} مسجّل من الموقع القديم — هذا يكسر الصفحة. اضغط زر المسح تحت.`);
    else add('Service Worker','ok','لا يوجد — نظيف');
  });
} else add('Service Worker','ok','غير مدعوم — لا مشكلة');

// 4. الوصول لـ Firebase SDK
fetch('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js',{mode:'no-cors'})
  .then(()=> add('الوصول إلى Firebase','ok','gstatic.com يستجيب'))
  .catch(e=> add('الوصول إلى Firebase','bad',
    'محجوب أو الشبكة تمنعه — هذا سبب الصفحة البيضاء. جرّب شبكة أخرى أو VPN.'));

// 5. الوصول للخطوط
fetch('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic',{mode:'no-cors'})
  .then(()=> add('خطوط Google','ok','تصل'))
  .catch(()=> add('خطوط Google','wait','لا تصل — الشكل يتأثر فقط، لا تمنع العمل'));

// 6. الأخطاء
let errs = 0;
window.addEventListener('error', e=>{
  errs++;
  add('خطأ في الصفحة','bad', (e.message||'') + ' — ' + (e.filename||'').split('/').pop());
});
setTimeout(()=>{ if(!errs) add('أخطاء JavaScript','ok','لا أخطاء'); }, 1600);

// 7. معلومات
setTimeout(()=>{
  add('الرابط الحالي','ok', location.href);
  add('المتصفح','ok', navigator.userAgent.slice(0,90));
}, 1800);

async function killSW(){
  try{
    if('serviceWorker' in navigator){
      const rs = await navigator.serviceWorker.getRegistrations();
      for(const r of rs) await r.unregister();
    }
    if(window.caches){
      const keys = await caches.keys();
      for(const k of keys) await caches.delete(k);
    }
    alert('تم المسح. سيُعاد تحميل الصفحة.');
    location.reload(true);
  }catch(e){ alert('تعذّر المسح: '+e.message); }
}
</script>
</body>
</html>
