<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Plus | جلب الخدمات</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #030712; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #0a0f1f; border: 1px solid rgba(0,242,254,0.2); border-radius: 24px; padding: 40px; max-width: 500px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .neon-text { color: #00f2fe; text-shadow: 0 0 10px rgba(0,242,254,0.5); }
        .neon-btn { background: linear-gradient(135deg, #00f2fe, #00b4d8); color: #000; font-weight: 900; padding: 16px; border-radius: 14px; font-size: 16px; width: 100%; border: none; cursor: pointer; }
        .neon-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .input-field { background: #020617; border: 1px solid rgba(0,242,254,0.2); color: #fff; border-radius: 14px; padding: 14px; width: 100%; font-size: 14px; outline: none; }
        .input-field:focus { border-color: #00f2fe; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { width: 24px; height: 24px; border: 3px solid rgba(0,0,0,0.3); border-top-color: #000; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; }
        .log-box { background: #020617; border-radius: 14px; padding: 16px; max-height: 200px; overflow-y: auto; font-size: 12px; margin-top: 16px; }
    </style>
</head>
<body>

    <div class="card space-y-5">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-black neon-text">Media Plus</h1>
            <p class="text-sm text-gray-400">جلب الخدمات من API مباشرة إلى المتجر</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="text-xs text-gray-400 block mb-1">رابط API</label>
                <input type="url" id="apiUrl" value="https://api.libyacards.com/api/provider/digital-products" class="input-field" placeholder="https://api.example.com/products">
            </div>
            
            <div>
                <label class="text-xs text-gray-400 block mb-1">مفتاح API</label>
                <input type="text" id="apiKey" value="BjRLdFipMdSkzpSf90ljjpMlSWFN7Y5MQi1BPkUdyqOGMgpQobBnpNaJWCnY" class="input-field" placeholder="المفتاح السري">
            </div>

            <div>
                <label class="text-xs text-gray-400 block mb-1">نسبة الربح (%)</label>
                <input type="number" id="profit" value="10" step="0.1" min="0" max="100" class="input-field">
            </div>

            <div class="flex gap-2">
                <button onclick="startFetch()" id="fetchBtn" class="neon-btn">
                    <i class="fa-solid fa-cloud-download"></i> جلب الخدمات
                </button>
                <button onclick="showMockData()" class="bg-purple-600/20 text-purple-400 border border-purple-500/30 px-4 py-3 rounded-xl text-sm font-bold whitespace-nowrap">
                    <i class="fa-solid fa-database"></i> تجريبي
                </button>
            </div>
        </div>

        <div id="status" class="hidden bg-amber-500/10 border border-amber-500/20 rounded-xl p-3 text-xs text-amber-400 text-center"></div>
        <div id="result" class="hidden rounded-xl p-3 text-xs text-center"></div>
        <div id="logBox" class="log-box hidden"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyARNJOPAycWU3YJdZSBN1d9uoLrvso3i4Y",
            authDomain: "cd-card-87365.firebaseapp.com",
            projectId: "cd-card-87365",
            storageBucket: "cd-card-87365.firebasestorage.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let fetchedCategories = [];
        let fetchedProducts = [];

        function log(msg) {
            const box = document.getElementById("logBox");
            box.classList.remove("hidden");
            box.innerHTML += `<div class="text-gray-400">${new Date().toLocaleTimeString()} - ${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function showStatus(msg, type) {
            const el = document.getElementById("status");
            el.classList.remove("hidden");
            el.className = `bg-${type}-500/10 border border-${type}-500/20 rounded-xl p-3 text-xs text-${type}-400 text-center`;
            el.innerHTML = msg;
        }

        function showResult(msg, type) {
            const el = document.getElementById("result");
            el.classList.remove("hidden");
            el.className = `bg-${type}-500/10 border border-${type}-500/20 rounded-xl p-3 text-xs text-${type}-400 text-center`;
            el.innerHTML = msg;
        }

        function showMockData() {
            fetchedCategories = [
                { id: "pubg", name: "ببجي موبايل", image: "https://i.imgur.com/eXbN8Yx.jpg" },
                { id: "freefire", name: "فري فاير", image: "https://i.imgur.com/vHkWq1W.jpg" },
                { id: "fortnite", name: "فورتنايت", image: "https://images.unsplash.com/photo-1589241062272-c0a000e28dc5?q=80" },
                { id: "steam", name: "ستيم", image: "https://images.unsplash.com/photo-1605899435973-ca2d1a8431e1?q=80" },
                { id: "netflix", name: "نتفليكس", image: "https://images.unsplash.com/photo-1522869635100-9f4c5e86aa37?q=80" }
            ];
            fetchedProducts = [
                { name: "شدات ببجي 60UC", price: 1.00, categoryId: "pubg", type: "id", image: "https://i.imgur.com/eXbN8Yx.jpg" },
                { name: "شدات ببجي 300UC", price: 5.00, categoryId: "pubg", type: "id", image: "https://i.imgur.com/eXbN8Yx.jpg" },
                { name: "جواهر فري فاير 110", price: 1.20, categoryId: "freefire", type: "id", image: "https://i.imgur.com/vHkWq1W.jpg" },
                { name: "فورتنايت 1000 V-Bucks", price: 8.00, categoryId: "fortnite", type: "id", image: "https://images.unsplash.com/photo-1589241062272-c0a000e28dc5?q=80" },
                { name: "ستيم 5$", price: 5.00, categoryId: "steam", type: "none", image: "https://images.unsplash.com/photo-1605899435973-ca2d1a8431e1?q=80" },
                { name: "نتفليكس شهر", price: 7.00, categoryId: "netflix", type: "none", image: "https://images.unsplash.com/photo-1522869635100-9f4c5e86aa37?q=80" }
            ];
            showResult(`✅ تم تحميل ${fetchedCategories.length} أقسام و ${fetchedProducts.length} منتج تجريبي`, "purple");
            document.getElementById("status").classList.add("hidden");
        }

        async function startFetch() {
            const url = document.getElementById("apiUrl").value.trim();
            const key = document.getElementById("apiKey").value.trim();
            const profit = parseFloat(document.getElementById("profit").value) || 10;
            const btn = document.getElementById("fetchBtn");

            if (!url) return alert("⚠️ أدخل رابط API");

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> جاري الجلب...';
            
            document.getElementById("logBox").innerHTML = "";
            document.getElementById("status").classList.remove("hidden");
            document.getElementById("result").classList.add("hidden");
            
            showStatus('<i class="fa-solid fa-circle-notch animate-spin"></i> جاري الاتصال بالـ API...', "amber");
            log("بدء عملية الجلب...");
            log(`الرابط: ${url}`);

            // طرق مختلفة للمصادقة
            const methods = [
                { name: "Bearer", headers: { 'Authorization': `Bearer ${key}`, 'Accept': 'application/json' } },
                { name: "X-API-Key", headers: { 'X-API-Key': key, 'Accept': 'application/json' } },
                { name: "api-key", headers: { 'api-key': key, 'Accept': 'application/json' } },
                { name: "Query: api_key", url: url.includes('?') ? `${url}&api_key=${key}` : `${url}?api_key=${key}`, headers: { 'Accept': 'application/json' } },
                { name: "Query: key", url: url.includes('?') ? `${url}&key=${key}` : `${url}?key=${key}`, headers: { 'Accept': 'application/json' } }
            ];

            let data = null;
            let successMethod = "";

            for (const method of methods) {
                try {
                    const fetchUrl = method.url || url;
                    log(`محاولة: ${method.name} → ${fetchUrl}`);
                    
                    const response = await fetch(fetchUrl, { method: 'GET', headers: method.headers });
                    log(`الرد: HTTP ${response.status}`);
                    
                    if (response.ok) {
                        const contentType = response.headers.get('content-type');
                        if (contentType && contentType.includes('application/json')) {
                            data = await response.json();
                            successMethod = method.name;
                            log(`✅ نجحت طريقة: ${method.name}`);
                            break;
                        } else {
                            log(`⚠️ الرد مش JSON: ${contentType}`);
                        }
                    }
                } catch (e) {
                    log(`❌ فشل ${method.name}: ${e.message}`);
                }
            }

            if (!data) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-cloud-download"></i> جلب الخدمات';
                showStatus("❌ فشل الاتصال بجميع الطرق. استخدم الزر 'تجريبي' للبيانات الوهمية.", "red");
                log("❌ جميع المحاولات فشلت");
                return;
            }

            // استخراج البيانات
            log("📦 جاري استخراج البيانات...");
            
            let cats = [];
            let prods = [];

            // استخراج الأقسام
            if (data.categories) cats = data.categories;
            else if (data.data?.categories) cats = data.data.categories;
            else if (data.Categories) cats = data.Categories;
            else if (data.types) cats = data.types;
            else if (data.sections) cats = data.sections;
            else {
                const all = data.products || data.services || data.items || data.data || [];
                if (Array.isArray(all) && all.length > 0) {
                    const names = [...new Set(all.map(p => p.category || p.categoryId || p.type).filter(Boolean))];
                    cats = names.map((n, i) => ({ id: `cat_${i}`, name: n }));
                }
            }

            // استخراج المنتجات
            if (data.products) prods = data.products;
            else if (data.data?.products) prods = data.data.products;
            else if (data.services) prods = data.services;
            else if (data.data?.services) prods = data.data.services;
            else if (data.items) prods = data.items;
            else if (Array.isArray(data)) prods = data;
            else if (Array.isArray(data.data)) prods = data.data;
            else {
                for (const key of Object.keys(data)) {
                    if (Array.isArray(data[key]) && data[key].length > 0) {
                        prods = data[key];
                        break;
                    }
                }
            }

            fetchedCategories = cats;
            fetchedProducts = prods;

            log(`✅ تم استخراج ${cats.length} أقسام و ${prods.length} منتج`);

            if (prods.length === 0) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-cloud-download"></i> جلب الخدمات';
                showResult("⚠️ لم يتم العثور على منتجات في البيانات. استخدم 'تجريبي'.", "yellow");
                return;
            }

            // الاستيراد
            showStatus(`<i class="fa-solid fa-circle-notch animate-spin"></i> جاري استيراد ${cats.length} أقسام و ${prods.length} منتج...`, "amber");
            await importData(profit);

            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-cloud-download"></i> جلب الخدمات';
            showStatus("", "emerald");
            document.getElementById("status").classList.add("hidden");
            showResult(`✅ تم استيراد ${cats.length} أقسام و ${prods.length} منتج بنجاح إلى المتجر!`, "emerald");
            log("🎉 تم الانتهاء بنجاح!");
        }

        async function importData(profit) {
            // استيراد الأقسام
            log("📂 جاري استيراد الأقسام...");
            for (const cat of fetchedCategories) {
                const catData = {
                    name: cat.name || cat.title || 'قسم جديد',
                    image: cat.image || cat.cover || cat.icon || '',
                    cover: cat.image || cat.cover || cat.icon || '',
                    order: Date.now()
                };
                await db.collection("categories").add(catData);
                log(`✅ قسم: ${catData.name}`);
            }

            // استيراد المنتجات
            log("🎮 جاري استيراد المنتجات...");
            for (const prod of fetchedProducts) {
                const originalPrice = parseFloat(prod.price || prod.priceUSD || 0);
                const finalPriceUSD = originalPrice + (originalPrice * profit / 100);
                const finalPriceLYD = parseFloat((finalPriceUSD * 6.80).toFixed(3));

                await db.collection("products").add({
                    name: prod.name || prod.title || 'منتج جديد',
                    priceLYD: finalPriceLYD,
                    price: finalPriceLYD,
                    priceUSD: parseFloat(finalPriceUSD.toFixed(2)),
                    image: prod.image || prod.img || '',
                    img: prod.image || prod.img || '',
                    description: prod.description || '',
                    active: true,
                    type: prod.type || 'id',
                    categoryId: prod.categoryId || prod.category_id || '',
                    sales: 0,
                    order: Date.now()
                });
                log(`✅ منتج: ${prod.name} - ${finalPriceLYD.toFixed(3)} د.ل`);
            }
        }
    </script>
</body>
</html>
