<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Plus | لوحة الخدمات</title>
    <!-- Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --accent-color: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-container {
            width: 100%;
            max-width: 600px;
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
        }

        .header-zone {
            text-align: center;
            margin-bottom: 24px;
        }

        .header-zone h2 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .header-zone p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            right: 12px;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 12px 40px 12px 12px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        /* قفل حقل الكمية عند تفعيل السعر الموحد */
        .form-control:disabled {
            background: #1e293b;
            color: #64748b;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #2563eb;
        }

        .icons-display {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .icon-item {
            font-size: 1.8rem;
            color: var(--text-muted);
            transition: color 0.3s ease;
        }

        .icon-item:hover {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header-zone">
            <h2><i class="fas fa-sliders-h" style="color: var(--accent-color); margin-left: 8px;"></i>إدارة الخدمات الرقمية</h2>
            <p>تعديل وتحديث البيانات الأساسية للمنصة</p>
        </div>

        <form id="serviceForm" onsubmit="handleSubmit(event)">
            <!-- حقل اختيار الخدمة -->
            <div class="form-group">
                <label for="serviceType">نوع الخدمة / التطبيق</label>
                <div class="input-wrapper">
                    <i class="fas fa-layer-group"></i>
                    <select id="serviceType" class="form-control" onchange="handleServiceChange()">
                        <option value="tiktok">TikTok Services</option>
                        <option value="instagram">Instagram Services</option>
                        <option value="games">Games Top-Up</option>
                    </select>
                </div>
            </div>

            <!-- حقل السعر -->
            <div class="form-group">
                <label for="unitPrice">السعر الثابت ($)</label>
                <div class="input-wrapper">
                    <i class="fas fa-dollar-sign"></i>
                    <input type="number" id="unitPrice" class="form-control" value="5.00" step="0.01" required>
                </div>
            </div>

            <!-- حقل الكمية (مقفل تلقائياً بناءً على قواعد السعر الموحد للوحدة) -->
            <div class="form-group">
                <label for="quantity">الكمية المطلوبة</label>
                <div class="input-wrapper">
                    <i class="fas fa-calculator"></i>
                    <input type="number" id="quantity" class="form-control" value="1" disabled>
                </div>
            </div>

            <button type="submit" class="btn-submit">حفظ التغييرات وتحديث اللوحة</button>
        </form>

        <!-- استبدال العروض الرسومية القديمة بثيم أيقونات التطبيقات الصافي -->
        <div class="icons-display">
            <div class="icon-item" title="TikTok"><i class="fab fa-tiktok"></i></div>
            <div class="icon-item" title="Instagram"><i class="fab fa-instagram"></i></div>
            <div class="icon-item" title="Gaming"><i class="fas fa-gamepad"></i></div>
        </div>
    </div>

    <script>
        // دالة التعامل مع تغيير نوع الخدمة
        function handleServiceChange() {
            const service = document.getElementById('serviceType').value;
            const priceField = document.getElementById('unitPrice');
            
            // تخصيص الأسعار الافتراضية حسب اختيار القسم
            if (service === 'tiktok') {
                priceField.value = "5.00";
            } else if (service === 'instagram') {
                priceField.value = "4.50";
            } else if (service === 'games') {
                priceField.value = "10.00";
            }
        }

        // دالة إرسال البيانات وحفظها (ربطها مع Firebase لاحقاً)
        function handleSubmit(event) {
            event.preventDefault();
            
            const serviceData = {
                type: document.getElementById('serviceType').value,
                price: parseFloat(document.getElementById('unitPrice').value),
                quantity: parseInt(document.getElementById('quantity').value) // ستبقى 1 دائماً كما هو مطلوب
            };

            console.log("تم تحديث البيانات بنجاح:", serviceData);
            alert("تم حفظ التعديلات بنجاح وتحديث اللوحة!");
        }
    </script>

</body>
</html>
